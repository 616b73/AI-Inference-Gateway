# Test profile — uses H2 in-memory DB instead of PostgreSQL.
# Flyway is disabled because our migrations use Postgres-specific SQL;
# Hibernate auto-DDL creates the schema from JPA entities instead.

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  flyway:
    enabled: false

ollama:
  base-url: http://localhost:11434
