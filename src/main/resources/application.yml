spring:
  application:
    name: ai-inference-gateway
  profiles:
    default: production
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gateway_db}?connectTimeout=3&socketTimeout=5
    username: ${DB_USERNAME:gateway}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 2000
      validation-timeout: 1000
      connection-init-sql: SET statement_timeout = 2000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      jakarta.persistence.query.timeout: 2000
  transaction:
    default-timeout: 5s
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  max-http-request-header-size: 16KB
  tomcat:
    threads:
      max: 100
      min-spare: 10
    max-connections: 256
    accept-count: 32
    connection-timeout: 5s
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

gateway:
  max-request-bytes: 1048576
  max-concurrent-requests: 64
  total-timeout-ms: 120000
  transport:
    connect-timeout-ms: 2000
    read-timeout-ms: 30000
    pool-acquire-timeout-ms: 250
    max-connections: 32
    max-connections-per-route: 8
    max-response-bytes: 2097152
  bootstrap:
    local-enabled: false

management:
  server:
    port: ${MANAGEMENT_PORT:9090}
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    distribution:
      percentiles-histogram:
        gateway.requests: true
        gateway.provider.duration: true

logging:
  level:
    org.apache.hc.client5.http: WARN
    org.apache.hc.core5.http: WARN
